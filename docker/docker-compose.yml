services:
  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    ports:
      - "8888:8888"
    volumes:
      - ../notebooks:/home/jovyan/work
      - ../data:/home/jovyan/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: >
      start-notebook.sh
      --NotebookApp.token=''
      --NotebookApp.password=''
      --NotebookApp.ip='0.0.0.0'
      --NotebookApp.port=8888
